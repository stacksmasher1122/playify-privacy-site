<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playify</title>
<meta name="description" content="Playify by Yugora LLP — discover and book sports venues, join matches and connect with players.">
<style>
  :root{ --bg:#ffffff; --text:#1f2328; --muted:#5f6b66; --accent:#0f9d58; --rule:#e3e7e5; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1312; --text:#e6ebe8; --muted:#9aa6a0; --accent:#3ddc84; --rule:#26302c; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .page{max-width:780px;margin:0 auto;padding:32px 20px 64px}
  .logo{display:inline-block;font-size:28px;font-weight:800;letter-spacing:.2px;color:var(--text);text-decoration:none;margin-bottom:28px}
  .logo span{color:var(--accent)}
  h1{font-size:32px;line-height:1.25;margin:0 0 10px}
  p{margin:0 0 14px;color:var(--muted)}
  hr{border:0;border-top:1px solid var(--rule);margin:28px 0}
  ul{list-style:none;padding-left:0;margin:0}
  ul li{position:relative;padding-left:20px;margin:6px 0}
  ul li::before{content:"-";position:absolute;left:4px;color:var(--muted)}
  a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="page">
  <a class="logo" href="/">Play<span>ify</span></a>

  <h1>Playify</h1>
  <p>Book sports venues, join matches and play with people near you. Playify is operated by Yugora LLP.</p>

  <hr>

  <ul>
    <li><a href="/privacypolicy.html">Privacy Policy</a></li>
  </ul>

  <hr>
</div>
</body>
</html>
